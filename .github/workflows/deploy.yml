name: collect & deploy

on:
  schedule:
    # UTC 1:00 / 7:00 / 13:00 = 北京时间 9:00 / 15:00 / 21:00，每天三次
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # SKILL 榜无需登录；小工具榜需要 secrets.XHS_COOKIE（未配置时自动跳过）
      - name: Collect snapshot
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: npm run collect || echo "::warning::collect failed, building with existing snapshots"

      - name: Aggregate
        run: npm run aggregate

      - name: Build
        run: npm run build

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/vibe-snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "snapshot $(date -u +%F-%H:%M UTC) [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
